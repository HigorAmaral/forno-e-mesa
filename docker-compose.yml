services:
  postgres:
    image: postgres:16-alpine
    container_name: forno-e-mesa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forno_e_mesa
    ports:
      - "5432:5432"
    volumes:
      - forno_e_mesa_pgdata:/var/lib/postgresql/data

volumes:
  forno_e_mesa_pgdata:
